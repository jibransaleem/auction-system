<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auction Test Client</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --green: #10b981;
      --red: #ef4444;
      --amber: #f59e0b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .header h2 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.875rem;
    }

    .user-pill {
      background: #0f172a;
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 999px;
      color: var(--muted);
    }

    .user-pill b {
      color: var(--text);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.15);
      color: var(--amber);
    }

    .status.connected {
      background: rgba(16, 185, 129, 0.15);
      color: var(--green);
    }

    .status.disconnected {
      background: rgba(239, 68, 68, 0.15);
      color: var(--red);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .bid-box {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    input[type="number"] {
      flex: 1;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    input[type="number"]:focus {
      border-color: var(--primary);
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .quick-bids {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .btn-secondary {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #334155;
      color: var(--text);
    }

    .btn-spam {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: var(--amber);
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-left: auto;
    }

    .btn-spam:hover:not(:disabled) {
      background: rgba(245, 158, 11, 0.28);
      color: #fde68a;
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    #log {
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      height: 320px;
      overflow-y: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      line-height: 1.5;
    }

    .log-line {
      margin-bottom: 4px;
      word-break: break-all;
    }

    .ts { color: #64748b; margin-right: 6px; }
    .dir-out { color: #60a5fa; }
    .dir-in  { color: #34d399; }
    .dir-sys { color: #fbbf24; }
    .dir-err { color: #f87171; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>Auction Test Client</h2>
      <div class="meta">
        <span class="user-pill">User: <b id="who"></b></span>
        <span id="status" class="status"><span class="dot"></span><span id="status-text">Connecting</span></span>
      </div>
    </div>

    <div class="bid-box">
      <input id="amount" type="number" min="1" placeholder="Enter bid amount..." />
      <button id="bid-btn" onclick="bid()" disabled>Place Bid</button>
    </div>

    <div class="quick-bids">
      <button class="btn-secondary" onclick="bump(10)">+10</button>
      <button class="btn-secondary" onclick="bump(50)">+50</button>
      <button class="btn-secondary" onclick="bump(100)">+100</button>
      <button class="btn-secondary" onclick="bump(500)">+500</button>
      <button id="spam-btn" class="btn-spam" onclick="spam()" disabled>Spam 20</button>
    </div>

    <div class="log-header">
      <span>Event Stream</span>
      <button class="btn-secondary" onclick="clearLog()">Clear</button>
    </div>
    <div id="log"></div>
  </div>

  <script>
    const user = new URLSearchParams(location.search).get("user")
                 || "u" + Math.floor(Math.random() * 1000);
    document.getElementById("who").textContent = user;

    const logEl = document.getElementById("log");
    const amountEl = document.getElementById("amount");
    const bidBtn = document.getElementById("bid-btn");
    const spamBtn = document.getElementById("spam-btn");
    const statusEl = document.getElementById("status");
    const statusText = document.getElementById("status-text");

    const proto = location.protocol === "https:" ? "wss://" : "ws://";
    const ws = new WebSocket(proto + location.host + "/ws?user=" + encodeURIComponent(user));

    function appendLog(cls, prefix, text) {
      const line = document.createElement("div");
      line.className = "log-line " + cls;
      const now = new Date().toLocaleTimeString([], { hour12: false });
      line.innerHTML = `<span class="ts">[${now}]</span><strong>${prefix}</strong> ${escapeHtml(text)}`;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }

    function setStatus(state, label) {
      statusEl.className = "status " + state;
      statusText.textContent = label;
      const connected = state === "connected";
      bidBtn.disabled = !connected;
      spamBtn.disabled = !connected;
    }

    ws.onopen = () => {
      setStatus("connected", "Connected");
      appendLog("dir-sys", "SYS", "WebSocket connected");
    };

    ws.onclose = () => {
      setStatus("disconnected", "Disconnected");
      appendLog("dir-err", "SYS", "WebSocket disconnected");
    };

    ws.onerror = () => {
      appendLog("dir-err", "ERR", "WebSocket error");
    };

    ws.onmessage = (e) => {
      try {
        const data = JSON.parse(e.data);
        if (typeof data.amount === "number" && (!amountEl.value || Number(amountEl.value) <= data.amount)) {
          amountEl.placeholder = `Current: ${data.amount}`;
        }
      } catch (_) {}
      appendLog("dir-in", "IN ", e.data);
    };

    function bump(delta) {
      const cur = parseInt(amountEl.value, 10) || 0;
      amountEl.value = cur + delta;
      amountEl.focus();
    }

    function bid() {
      const amount = parseInt(amountEl.value, 10);
      if (!Number.isFinite(amount) || amount <= 0) {
        appendLog("dir-err", "ERR", "Enter a valid positive bid amount");
        return;
      }
      const msg = {
        type: "bid",
        bid_id: "b-" + Date.now() + "-" + Math.random().toString(36).slice(2),
        amount: amount,
      };
      ws.send(JSON.stringify(msg));
      appendLog("dir-out", "OUT", JSON.stringify(msg));
    }

    function spam() {
      const base = parseInt(amountEl.value, 10) || 100;
      const now = Date.now();
      for (let i = 0; i < 20; i++) {
        const msg = {
          type: "bid",
          bid_id: "s-" + now + "-" + i,
          amount: base + i,
        };
        ws.send(JSON.stringify(msg));
        appendLog("dir-out", "OUT", JSON.stringify(msg));
      }
      appendLog("dir-sys", "SYS", `sent 20 bids fast (base=${base}, ${base}..${base + 19})`);
    }

    function clearLog() {
      logEl.innerHTML = "";
    }

    amountEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !bidBtn.disabled) bid();
    });
  </script>
</body>
</html>
