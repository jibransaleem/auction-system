
worker_processes auto;

events {
    worker_connections 65536;
}

stream {
    upstream gateways {
        least_conn;

        server gateway1:8080;
        server gateway2:8080;
        server gateway3:8080;
        server gateway4:8080;
        server gateway5:8080;
    }

    server {
        listen 80;
        proxy_pass gateways;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
    }
}
