worker_processes auto;

events {
    worker_connections 65536;
}

stream {
    upstream gateways {
        least_conn;

        server gateway1:8080 max_fails=2 fail_timeout=10s;
        server gateway2:8080 max_fails=2 fail_timeout=10s;
        server gateway3:8080 max_fails=2 fail_timeout=10s;
        server gateway4:8080 max_fails=2 fail_timeout=10s;
        server gateway5:8080 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 80;
        proxy_pass gateways;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
        proxy_next_upstream on;
        proxy_next_upstream_tries 3;
    }
}