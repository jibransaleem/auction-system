x-gateway: &gateway
  build:
    context: .
    args:
      PKG: ./cmd/gateway
  env_file: .env
  environment:
    ENGINE_ADDR: engine:50051
    AUCTION_ID: ${AUCTION_ID:-a300}
  depends_on:
    - engine
  restart: on-failure

services:
  engine:
    build:
      context: .
      args:
        PKG: .
    env_file: .env
    environment:
      AUCTION_ID: ${AUCTION_ID:-a300}
      AUCTION_DURATION: ${AUCTION_DURATION:-20m}
      STOCK: ${STOCK:-3}

  gateway1:
    <<: *gateway
  gateway2:
    <<: *gateway
  gateway3:
    <<: *gateway
  gateway4:
    <<: *gateway
  gateway5:
    <<: *gateway

  persister:
    build:
      context: .
      args:
        PKG: ./cmd/persister
    env_file: .env
    environment:
      AUCTION_ID: ${AUCTION_ID:-a300}
      STOCK: ${STOCK:-3}
    restart: on-failure

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway1
      - gateway2
      - gateway3
      - gateway4
      - gateway5
    restart: on-failure