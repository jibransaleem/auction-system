x-gateway: &gateway
  build:
    context: .
    args:
      PKG: ./cmd/gateway
  image: auction-gateway:local
  env_file:
    - .env
  environment:
    ENGINE_ADDR: "auction-engine:50051"
    GATEWAY_ADDR: ":8080"
    AUCTION_ID: "a1"
    AUCTION_TITLE: "Flash auction"
  depends_on:
    - engine
  networks:
    - auction-net
  restart: unless-stopped

services:
  engine:
    build:
      context: .
      args:
        PKG: .
    image: auction-engine:local
    container_name: auction-engine
    env_file:
      - .env
    environment:
      GRPC_ADDR: ":50051"
      AUCTION_ID: "a1"
      AUCTION_TITLE: "Flash auction"
      MIN_PRICE: "100"
      MIN_INCREMENT: "10"
      STOCK: "3"
      AUCTION_START_DELAY: "0s"
      AUCTION_DURATION: "${AUCTION_DURATION:-20m}"
    ports:
      - "50051:50051"
    networks:
      - auction-net
    restart: unless-stopped

  gateway1:
    <<: *gateway
  gateway2:
    <<: *gateway
  gateway3:
    <<: *gateway
  gateway4:
    <<: *gateway
  gateway5:
    <<: *gateway

  persister:
    build:
      context: .
      args:
        PKG: ./cmd/persister
    image: auction-persister:local
    container_name: auction-persister
    depends_on:
      - engine
    env_file:
      - .env
    environment:
      AUCTION_ID: "a1"
      STOCK: "3"
      CONSUMER: "p1"
      EXIT_ON_CLOSE: "false"
    networks:
      - auction-net
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: auction-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway1
      - gateway2
      - gateway3
      - gateway4
      - gateway5
    networks:
      - auction-net
    restart: unless-stopped

networks:
  auction-net:
    name: auction-net
    driver: bridge